/* SALT is black and white by rule; this page commits to a single light look, like the printed menu.
   --ground = page (white), --paper = ink (black). */
:root{
  color-scheme:light;
  --ground:#FFFFFF;
  --surface:#F5F5F4;
  --surface-2:#EDEDEC;
  --line:#E3E3E1;
  --line-strong:#B9B9B6;
  --paper:#000000;
  --muted:#555553;
  --dim:#858582;
  --danger:#C8321F;
  --display:"RightGrotesk","Arial Narrow",Impact,sans-serif;
  --body:"Mori","Helvetica Neue",Arial,sans-serif;
  --header-h:64px;
  --bar-h:84px;
}
html[lang="ar"]{--display:"LyonArabic","Mori",Tahoma,sans-serif;--body:"LyonArabic","Mori",Tahoma,sans-serif}
html,body{background:var(--ground);color:var(--paper)}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--header-h);display:flex;align-items:center;gap:14px;padding-inline:max(16px,3vw);background:var(--ground);border-bottom:1px solid var(--line)}
.logo{height:26px;width:auto;color:var(--paper);flex:none;display:block}
.logo path,.logo polygon{fill:currentColor}
.hdr-event{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-inline-start:14px;border-inline-start:1px solid var(--line-strong);white-space:nowrap}
html[lang="ar"] .hdr-event{letter-spacing:0;font-size:14px}
.hdr-sp{flex:1}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--line-strong);border-radius:999px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--paper);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.lang{border:1px solid var(--paper);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;min-width:64px}
.lang:hover{background:var(--paper);color:var(--ground)}
.lang .ar{font-family:"LyonArabic",Tahoma,sans-serif}
@media (max-width:560px){.hdr-event{display:none}.status span{display:none}.status{padding:7px}}

/* ---------- shared type ---------- */
.display{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.88;letter-spacing:.005em;text-wrap:balance;margin:0}
html[lang="ar"] .display{text-transform:none;line-height:1.15;letter-spacing:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:14px}

/* =========================================================
   PDF COMPRESSION — rasterize each page with pdf.js, re-encode as a lighter
   PDF with pdf-lib, stepping quality/scale down until the file is at or
   under CV_TARGET_BYTES (~512 KB). Runs entirely in the browser before
   upload. Falls back to the original file if compression fails for any
   reason, so a slow/odd PDF never blocks a candidate from applying.
   ========================================================= */
if (window["pdfjs-dist/build/pdf"]) window.pdfjsLib = window["pdfjs-dist/build/pdf"];
if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

async function renderPageToJpeg(pdfDoc, pageNum, scale, quality){
  const page = await pdfDoc.getPage(pageNum);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(viewport.width));
  canvas.height = Math.max(1, Math.round(viewport.height));
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport }).promise;
  const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
  return { blob, width: canvas.width, height: canvas.height };
}

async function buildCompressedPdf(file, scale, quality){
  const buf = await file.arrayBuffer();
  const pdfDoc = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const out = await PDFLib.PDFDocument.create();
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    const { blob, width, height } = await renderPageToJpeg(pdfDoc, i, scale, quality);
    const jpgBytes = new Uint8Array(await blob.arrayBuffer());
    const jpg = await out.embedJpg(jpgBytes);
    const pg = out.addPage([width, height]);
    pg.drawImage(jpg, { x: 0, y: 0, width, height });
  }
  return out.save();
}

const safeFile = (s) => String(s || "").replace(/[\\/:*?"<>|\u0000-\u001f]+/g, " ").replace(/\s+/g, "_").slice(0, 60) || "candidate";

async function compressPdfTo(file, targetBytes){
  if (!window.pdfjsLib || !window.PDFLib) return file;      // libraries didn't load: skip, upload original
  if (file.size <= targetBytes) return file;                 // already small enough
  const attempts = [
    { scale: 1.3, quality: 0.6 },
    { scale: 1.1, quality: 0.5 },
    { scale: 0.9, quality: 0.4 },
    { scale: 0.75, quality: 0.32 },
    { scale: 0.6, quality: 0.25 }
  ];
  let best = null;
  for (const a of attempts) {
    try {
      const bytes = await buildCompressedPdf(file, a.scale, a.quality);
      if (!best || bytes.length < best.length) best = bytes;
      if (bytes.length <= targetBytes) {
        return new File([bytes], file.name, { type: "application/pdf" });
      }
    } catch { /* try the next, smaller attempt */ }
  }
  // Couldn't hit the target: return the smallest version we managed, or the original.
  return best ? new File([best], file.name, { type: "application/pdf" }) : file;
}

const PLATE = `<ellipse class="plate" cx="${CX}" cy="${BASE+4}" rx="200" ry="12"/>`;
function viewBoxFor(items){
  const top = items.filter(i => i.key !== "side" && i.key !== "drink").reduce((m,i) => Math.min(m, i.y), BASE);
  const y = Math.min(150, top - 30);

/* Live stage: keyed layers that drop in, and slide when the stack changes. */
const live = new Map();
function renderLive(svg){
  const g = svg.querySelector(".stack");
  const items = stackItems(S.sel);
  svg.setAttribute("viewBox", viewBoxFor(items));
  const keys = new Set(items.map(i => i.key));
  for (const [k, rec] of live) if (!keys.has(k)) {
    live.delete(k);
    if (reduced || !rec.el.animate) { rec.el.remove(); continue; }
    const a = rec.el.animate([{opacity:1, transform:`translate(0px,${rec.y}px)`},{opacity:0, transform:`translate(0px,${rec.y-40}px)`}], {duration:220, easing:"ease-in"});
    a.onfinish = () => rec.el.remove();
  }
  const anims = [];
  items.forEach(it => {
    let rec = live.get(it.key);
    if (!rec) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "g");
      el.innerHTML = it.html;
      el.style.transform = `translate(0px,${it.y}px)`;
      rec = {el, y:it.y, sig:it.sig}; live.set(it.key, rec);
      anims.push(() => el.animate && !reduced && el.animate([
        {transform:`translate(0px,${it.y-170}px)`, opacity:0},
        {transform:`translate(0px,${it.y+7}px)`, opacity:1, offset:.72},
        {transform:`translate(0px,${it.y}px)`}
      ], {duration:560, easing:"cubic-bezier(.3,.7,.3,1)"}));
    } else {
      if (rec.sig !== it.sig) { rec.el.innerHTML = it.html; rec.sig = it.sig; anims.push(() => rec.el.animate && !reduced && rec.el.animate([{opacity:.2},{opacity:1}], {duration:260})); }
      if (rec.y !== it.y) { const from = rec.y; rec.el.style.transform = `translate(0px,${it.y}px)`; anims.push(() => rec.el.animate && !reduced && rec.el.animate([{transform:`translate(0px,${from}px)`},{transform:`translate(0px,${it.y}px)`}], {duration:380, easing:"cubic-bezier(.2,.8,.2,1)"})); rec.y = it.y; }
    }
    g.appendChild(rec.el);
  });
  anims.forEach(f => f());
  const empty = svg.parentElement.querySelector(".stage-empty");
  if (empty) empty.hidden = items.length > 0;
  const ghost = svg.querySelector(".ghostbun");
  if (ghost) ghost.style.display = items.length ? "none" : "";
}

function thumb(st, k){
  let body = "", vb;
  const at = (g, y) => `<g transform="translate(0 ${y})">${g.html}</g>`;
  if (st.id === "role") { body = at(bottomBun(k), 102) + at(topBun(k), 0); vb = `${X0-20} -20 ${W+40} 170`; }
  else if (st.id === "style") { body = `<g transform="translate(${CX} 44) scale(.92)">${sauceCup(k)}</g>` + at(patty("single"), 116) + at(sauce(k), 110); vb = `${X0-30} -6 ${W+60} 160`; }
  else if (st.id === "avail") { body = side(k).html; vb = `14 296 140 164`; }
  else if (st.id === "contract") { body = drink(k).html; vb = `414 218 150 240`; }
  else
  if (st.id === "exp") { const n = {fresh:1,single:1,double:2,triple:3}[k], p = patty(k); for (let i=0;i<n;i++) body += at(p, 90 - i*(p.h+4)); vb = `${X0-30} -10 ${W+60} 140`; }
  else if (st.id === "edu") { body = at(patty("single"), 70) + at(cheese(k), 56) + (k==="master" ? at(cheese(k), 44) : ""); vb = `${X0-30} 0 ${W+60} 120`; }
  else { body = at(patty("single"), 64) + at(topping(k), 46); vb = `${X0-22} 26 ${W+44} 76`; }
  return `<svg class="bg" viewBox="${vb}" aria-hidden="true">${body}</svg>`;
}

function normPhone(raw){
  const s = String(raw).replace(/[\s\-().]/g, "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  let m = s.match(/^(?:\+?966|00966|0)?(5\d{8})$/);
  if (m) return "+966" + m[1];
  m = s.match(/^(?:\+|00)(\d{8,15})$/);
  return m ? "+" + m[1] : null;
}
function cvError(f){
  if (!f) return "eCv";
  if (!(f.type === "application/pdf" || /\.pdf$/i.test(f.name))) return "eCvType";
  if (f.size > MAX_CV_MB*1048576) return "eCvSize";
  return null;
}

async function submit(){
  if (S.busy) return;
  const F = S.form, E = {};
  if (F.name.trim().length < 2) E.name = "eName";
  if (!normPhone(F.phone)) E.phone = "ePhone";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(F.email.trim())) E.email = "eEmail";
  if (F.cvMode !== "phone") { const ce = cvError(F.file); if (ce) E.cv = ce; }
  if (!F.consent) E.consent = "eConsent";
  S.errs = E;
  S.formErr = doneCount() < 7 ? "eLayers" : "";
  if (Object.keys(E).length || S.formErr) {
    renderCheckout($("#panel"));
    const first = document.querySelector('[aria-invalid="true"]') || $("#formErr:not(:empty)") || document.querySelector(".err:not(:empty)") || $(".oline.miss");
    if (first) first.scrollIntoView({block:"center", behavior: reduced ? "auto" : "smooth"});
    return;
  }
  S.busy = true; showSending();
  try {
    const byPhone = F.cvMode === "phone";
    const code = ensureCode();
    const now = new Date();
    let cvPath = null, cvFilename = null, cvSizeBytes = null;
    if (!byPhone) {
      let toUpload = F.file;
      try { toUpload = await compressPdfTo(F.file, CV_TARGET_BYTES); } catch { toUpload = F.file; }
      const path = `${code}/${Date.now()}_${safeFile(F.file.name || "cv.pdf")}`;
      const { error: upErr } = await sb.storage.from(CV_BUCKET).upload(path, toUpload, { contentType: "application/pdf", upsert: false });
      if (upErr) throw {step:"upload", e:upErr};
      cvPath = path; cvFilename = F.file.name; cvSizeBytes = toUpload.size;
    }
    const row = {
      order_code: code, lang: S.lang,
      name: F.name.trim(), phone: normPhone(F.phone), email: F.email.trim().toLowerCase(),
      cv_method: byPhone ? "email" : "upload", cv_email: byPhone ? S.cfg.cvEmail : null,
      cv_path: cvPath, cv_filename: cvFilename, cv_size_bytes: cvSizeBytes,
      role: S.sel.role, exp: S.sel.exp, edu: S.sel.edu, skills: [...S.sel.skills],
      style: S.sel.style, avail: S.sel.avail, contract: S.sel.contract,
      burger: burgerName(S.sel, 0), status: "new", device: (S.device && S.device.name) || ""
    };
    const { error: saveErr } = await sb.from("submissions").insert(row);
    if (saveErr) throw {step:"save", e:saveErr};
    S.order = {code, time: now, sel: JSON.parse(JSON.stringify(S.sel)), byPhone};
    S.busy = false; closeLayer(); disarmIdle();
    S.screen = "done"; render(); window.scrollTo(0,0);
  } catch (err) {
    S.busy = false; closeLayer();
    S.formErr = err.step === "upload" ? "eUpload" : "eSave";
    renderCheckout($("#panel"));
    $("#formErr").scrollIntoView({block:"center"});
  }
}

let doneTimer = null;
function renderDone(){
  const o = S.order;
  const hh = o.time.toLocaleTimeString(S.lang === "ar" ? "ar-SA" : "en-GB", {hour:"2-digit", minute:"2-digit"});
  const rows = STEPS.map(st => {
    const v = st.multi ? S.order.sel.skills.map(k => pick(optOf(st.id,k).n)).join(" + ") : pick(optOf(st.id, o.sel[st.id]).n);
    return `<div><span>${esc(pick(st.layer))}</span><span>${esc(v)}</span></div>`;
  }).join("");
  app.innerHTML = `<div class="done-bg"><section class="done">
    <article class="receipt" aria-labelledby="rNo">
      <div class="r-center">${logoHTML()}<div class="r-small">${esc(t("event"))} · ${esc(hh)}</div>
        <div class="r-small" style="margin-top:14px">${esc(t("orderNo"))}</div>
        <div class="r-no" id="rNo">${esc(o.code)}</div>
        <div class="r-small">${esc(t("received"))}</div></div>
      <hr class="r-rule">
      ${staticBurger(o.sel, "r-burger")}
      <p class="r-name">${esc(burgerName(o.sel))}</p>
      <hr class="r-rule">
      <div class="r-lines">${rows}</div>
      <hr class="r-rule">
      <p class="r-msg">${esc(t("doneMsg"))}<small>${esc(t("doneSub"))}</small></p>
      ${o.byPhone && S.cfg.cvEmail ? `<hr class="r-rule"><div class="r-qr"><div>${qrSVG(mailtoFor(o.code))}</div><div><b>${esc(t("rCvTitle"))}</b><br>${esc(t("rCvBody",{e:S.cfg.cvEmail, s:mailSubject(o.code)}))}</div></div>` : ""}
      <div class="r-small r-center" style="margin-top:18px">${esc(t("happy"))}</div>
    </article>
    <p class="countdown" id="cd">${esc(t("nextSalter",{n:DONE_RESET}))}</p>
    <button class="btn" type="button" id="newBtn">${esc(t("newOrder"))} ${ICON.arrow}</button>
  </section></div>`;
  $("#newBtn").onclick = resetAll;
  clearInterval(doneTimer);
  let n = o.byPhone ? DONE_RESET * 2 : DONE_RESET;
  $("#cd").textContent = t("nextSalter",{n});
  doneTimer = setInterval(() => { n--; const cd = $("#cd"); if (cd) cd.textContent = t("nextSalter",{n}); if (n <= 0) resetAll(); }, 1000);
}

function resetAll(){
  clearInterval(doneTimer); disarmIdle(); closeLayer();
  S.sel = { role:null, exp:null, edu:null, skills:[], style:null, avail:null, contract:null };
  S.form = { name:"", phone:"", email:"", consent:false, file:null, cvMode:"here" };
  S.errs = {}; S.formErr = ""; S.order = null; S.step = 0; S.screen = "welcome"; S.code = null; S.group = "all";
  setLang("en"); window.scrollTo(0,0);
}

/* =========================================================
   OVERLAYS: sending, idle, PIN
   ========================================================= */
function closeLayer(){ layer.innerHTML = ""; }
function showSending(){ layer.innerHTML = `<div class="ov"><div class="modal"><div class="spin"></div><p>${esc(t("sending"))}</p></div></div>`; }

let idleT = null, idleCd = null;
function armIdle(){ disarmIdle(); if (S.screen === "build" || S.screen === "checkout") idleT = setTimeout(idlePrompt, IDLE_MS); }
function disarmIdle(){ clearTimeout(idleT); clearInterval(idleCd); idleT = idleCd = null; }
function idlePrompt(){
  if (S.busy) return armIdle();
  let n = IDLE_GRACE;
  layer.innerHTML = `<div class="ov"><div class="modal" role="alertdialog" aria-labelledby="idleH"><h2 class="display" id="idleH">${esc(t("idleTitle"))}</h2><p>${esc(t("idleBody"))}</p><div class="ring" id="idleN">${n}</div><button class="btn" id="keepBtn" type="button">${esc(t("keep"))}</button></div></div>`;
  $("#keepBtn").onclick = () => { closeLayer(); armIdle(); };
  $("#keepBtn").focus();
  idleCd = setInterval(() => { n--; const el = $("#idleN"); if (el) el.textContent = n; if (n <= 0) resetAll(); }, 1000);
}
["pointerdown","keydown","input","touchstart"].forEach(ev => document.addEventListener(ev, () => { if (idleT && !idleCd) armIdle(); }, {passive:true, capture:true}));

/* Staff/admin view now lives in admin.html (Supabase-backed login +
   dashboard, CV export). The staffBtn in the footer opens it directly. */

/* =========================================================
   KIOSK NICETIES
   ========================================================= */
let lock = null;
async function wake(){ try { if (navigator.wakeLock && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.screen !== "welcome") wake(); });

/* Careers inbox for phone-sent CVs — read once from Supabase at load.
   (Managed from admin.html; falls back to DEFAULT_CV_EMAIL if unset.) */
sb.from("app_config").select("cv_email").eq("id", 1).maybeSingle().then(({ data }) => {
  S.cfg = { cvEmail: (data && data.cv_email) || DEFAULT_CV_EMAIL };
  if (S.screen === "checkout" && !S.busy && $("#panel")) { const a = document.activeElement; if (!a || !a.matches("input")) renderCheckout($("#panel")); }
}).catch(() => {});

$("#langBtn").onclick = () => setLang(S.lang === "en" ? "ar" : "en");
setLang("en");
})();

</script>
</body></html>
