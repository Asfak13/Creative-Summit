<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SALT Creative Summit — Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="assets/fonts.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* Same design system as index.html (the kiosk form): SALT is black and
   white by rule, RightGrotesk for display, Mori for body text. */
:root{
  color-scheme:light;
  --ground:#FFFFFF;
  --surface:#F5F5F4;
  --surface-2:#EDEDEC;
  --line:#E3E3E1;
  --line-strong:#B9B9B6;
  --paper:#000000;
  --muted:#555553;
  --dim:#858582;
  --danger:#C8321F;
  --ok:#1E7A3D;
  --ok-bg:#E7F5EC;
  --warn:#8A5B00;
  --warn-bg:#FFF2D9;
  --display:"RightGrotesk","Arial Narrow",Impact,sans-serif;
  --body:"Mori","Helvetica Neue",Arial,sans-serif;
  --header-h:64px;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--paper)}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header (matches the kiosk exactly) ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--header-h);display:flex;align-items:center;gap:14px;padding-inline:max(16px,3vw);background:var(--ground);border-bottom:1px solid var(--line)}
.logo{height:26px;width:auto;color:var(--paper);flex:none;display:block}
.logo path,.logo polygon{fill:currentColor}
.hdr-event{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-inline-start:14px;border-inline-start:1px solid var(--line-strong);white-space:nowrap}
.hdr-sp{flex:1}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--line-strong);border-radius:999px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--paper);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- buttons / inputs / links (same as the kiosk) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;border-radius:999px;border:2px solid var(--paper);background:var(--paper);color:var(--ground);font-weight:800;font-size:17px;letter-spacing:.01em;transition:transform .12s ease,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--paper)}
.btn.sm{min-height:46px;padding:0 18px;font-size:15px}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.input{min-height:56px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);padding:0 16px;font-size:17px;width:100%;box-sizing:border-box}
.link{background:none;border:0;padding:0;color:var(--paper);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.field{display:grid;gap:8px}
.field label{font-weight:700;font-size:15px}
.err{color:var(--danger);font-size:14px;min-height:0}
.hint{font-size:13px;color:var(--dim)}

.display{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.88;letter-spacing:.005em;margin:0}

/* ---------- footer (matches the kiosk exactly) ---------- */
.foot{max-width:1240px;margin:0 auto;padding-inline:max(16px,3vw);padding-block:18px 28px;display:flex;justify-content:space-between;gap:12px;color:var(--dim);font-size:13px;border-top:1px solid var(--line)}

/* ---------- dashboard (same block that powered the old in-page recruiter view) ---------- */
.rec-body{padding-inline:max(16px,3vw);padding-block:20px 48px;display:grid;gap:18px;max-width:1400px;margin:0 auto}
.rec-h{padding-inline:max(16px,3vw);padding-block:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.rec-h h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:30px;line-height:1;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:120px}
.stat b{display:block;font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools .input{min-height:46px;width:auto;flex:1 1 220px;font-size:15px}
.tools select.input{flex:0 1 200px}
.tools .date-group{display:flex;align-items:center;gap:8px;flex:0 1 auto}
.tools .date-group span{font-size:13px;color:var(--muted);white-space:nowrap}
.tools .date-group input.input{min-height:46px;width:auto;flex:none}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;max-height:calc(100vh - 360px)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:1200px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td a{color:var(--paper)}
tr:last-child td{border-bottom:0}
.muted{color:var(--muted)}
.chip{display:inline-block;border:1px solid var(--line-strong);border-radius:999px;padding:2px 8px;margin:0 4px 4px 0;font-size:12px;white-space:nowrap}
.empty-row td{text-align:center;color:var(--muted);padding:40px}
.note{border:1px solid var(--line-strong);border-radius:14px;padding:14px 16px;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;background:var(--paper);color:var(--ground);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px}

select.status{border:1px solid var(--line-strong);border-radius:999px;padding:5px 10px;font-size:12.5px;background:var(--surface);font-weight:600}
select.status.new{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
select.status.reviewed{border-color:var(--line-strong)}
select.status.shortlisted{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
select.status.rejected{border-color:var(--danger);color:var(--danger);background:#FBE9E7}

.cfg-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cfg-row label{font-weight:700;font-size:15px;white-space:nowrap}
.cfg-row .input{max-width:320px;min-height:46px;width:auto;flex:1 1 240px}
.cfg-note{font-size:13px;color:var(--muted)}

/* ---------- login screen ---------- */
.login-wrap{min-height:calc(100vh - var(--header-h));display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:400px;border:1px solid var(--line);border-radius:20px;padding:40px 32px}
.login-card h1{font-size:26px}
.login-card p.sub{margin:6px 0 28px;color:var(--muted);font-size:15px}
.login-card form{display:grid;gap:16px}
.login-card .btn{width:100%;margin-top:6px}
</style>
</head>

<script>
(() => {
"use strict";

const SUPABASE_URL = "https://bogplnipzgoiunlheneo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvZ3BsbmlwemdvaXVubGhlbmVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MDg4NjYsImV4cCI6MjEwNjA4NDg2Nn0.G0r1itQA038ZidJY1NHiIszXAnw3-nH70gheqgSW-64";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CV_BUCKET = "cvs";
/* Real Supabase Auth session (supabase-js persists this itself, in
   localStorage under its own key) — not a hand-rolled flag. RLS on
   submissions/cvs now requires this session; the anon key alone can no
   longer read or change anything beyond inserting new applications. */

const $ = (s, r=document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = $("#app");
const syncEl = $("#syncStatus span");

/* Human-readable labels for the coded values stored per submission —

const LABELS = {
  role: { social:"Storyteller", design:"Visual Maker", performance:"Number Cruncher", brand:"Brand Builder", ad:"Idea Chef" },
  exp: { fresh:"Fresh graduate", single:"1–3 years", double:"3–6 years", triple:"6+ years" },
  edu: { self:"Self-taught & online courses", diploma:"Diploma", bachelor:"Bachelor's degree", master:"Master's or higher" },
  skills: { copy:"Copywriting & captions", bilingual:"Arabic & English content", community:"Community management", trends:"Trend spotting & social listening", creators:"Influencer & creator partnerships",
    graphic:"Graphic design", identity:"Brand identity design", motion:"Motion graphics & animation", photo:"Photography", video:"Video production & editing", artdir:"Art direction & concepting",
    ads:"Paid social & media buying", analytics:"Analytics & reporting", crm:"CRM & email marketing",
    strategy:"Brand strategy & positioning", c360:"360 campaign development", pm:"Campaign & project management", events:"Events & activations" },
  style: { original:"Steady & reliable", chic:"Polished & detail-obsessed", honey:"Team glue", fire:"Fast & fearless", cheetos:"Playful & bold", vinegar:"Straight-talker", truffle:"Big-picture thinker" },
  avail: { now:"Right away", twoweeks:"Within 2 weeks", month:"Within a month", later:"In 2–3 months", grad:"After I graduate" },
  contract: { full:"Full-time", part:"Part-time", freelance:"Freelance / project-based", intern:"Internship" }
};
const L = (cat, k) => (k && LABELS[cat] && LABELS[cat][k]) || k || "";
const ROLE_OPTS = Object.keys(LABELS.role);

function toast(msg){ const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }

/* =========================================================
   LOGIN
   ========================================================= */
async function getSession(){
  const { data } = await sb.auth.getSession();
  return data.session || null;
}

function renderLogin(err){
  syncEl.textContent = "Signed out";
  $("#footRight").textContent = "";
  app.innerHTML = `<div class="login-wrap"><div class="login-card">
    <h1 class="display" style="font-size:30px">Admin sign in</h1>
    <p class="sub">Enter your admin email and password to view submissions.</p>
    <form id="loginForm">
      <div class="field"><label for="lEmail">Email</label><input class="input" id="lEmail" type="email" autocomplete="username" required></div>

      <button class="btn" type="submit" id="loginBtn">Sign in</button>
    </form>
  </div></div>`;
  $("#loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const btn = $("#loginBtn"); btn.disabled = true; btn.textContent = "Signing in…";
    const email = $("#lEmail").value.trim();
    const password = $("#lPass").value;
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      if (data.session) {
        renderDashboard();
      } else {
        renderLogin("Incorrect email or password.");

    } catch (err) {
      // Supabase Auth returns a real error for bad credentials (not just a
      // network failure), so surface that distinction to the person signing in.
      const msg = err && /invalid login credentials/i.test(err.message || "")
        ? "Incorrect email or password."
        : "Couldn't reach the server. Check your connection and try again.";
      renderLogin(msg);
      console.warn(err);
    }
  };
}

async function logout(){ await sb.auth.signOut(); if (unsub) { clearInterval(unsub); unsub = null; } renderLogin(); }

/* =========================================================
   DASHBOARD
   ========================================================= */
let rows = [], q = "", roleFilter = "", statusFilter = "", dateFrom = "", dateTo = "", unsub = null;

async function renderDashboard(){
  syncEl.textContent = "Loading…";
  $("#footRight").innerHTML = `<button class="link" id="logoutBtn" type="button">Log out</button>`;
  app.innerHTML = `
    <div class="rec-h">
      <h2>Applicants</h2>
      <span class="hdr-sp"></span>
      <button class="btn ghost sm" id="refreshBtn" type="button">Refresh</button>
      <button class="btn ghost sm" id="copyCsvBtn" type="button">Copy CSV</button>
      <button class="btn sm" id="csvBtn" type="button">Export CSV</button>
      <button class="btn sm" id="zipBtn" type="button">Export all CVs (ZIP)</button>
    </div>
    <div class="rec-body">
      <div class="cfg-row">
        <label for="cfgEmail">Careers inbox for CVs sent by phone</label>
        <input class="input" id="cfgEmail" type="email" placeholder="careers@yourcompany.com">
        <button class="btn sm ghost" id="cfgSaveBtn" type="button">Save</button>
        <span class="cfg-note" id="cfgNote"></span>
      </div>
      <div class="stats" id="stats"></div>
      <div class="tools">
        <input class="input" id="search" type="search" placeholder="Search name, email, phone, order #">
        <select class="input" id="roleFilter"><option value="">All roles</option>${ROLE_OPTS.map(k => `<option value="${k}">${esc(L("role",k))}</option>`).join("")}</select>
        <select class="input" id="statusFilter"><option value="">All statuses</option>
          <option value="new">New</option><option value="reviewed">Reviewed</option><option value="shortlisted">Shortlisted</option><option value="rejected">Rejected</option>
        </select>
        <span class="date-group"><span>From</span><input class="input" id="dateFrom" type="date"></span>
        <span class="date-group"><span>To</span><input class="input" id="dateTo" type="date"></span>
        <button class="link" id="clearDates" type="button">Clear dates</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr>
          <th>Order</th><th>Received</th><th>Name</th><th>Contact</th><th>Role</th><th>Experience</th><th>Education</th>
          <th>Skills</th><th>Work style</th><th>Start</th><th>Contract</th><th>CV</th><th>Status</th>
        </tr></thead>
        <tbody id="tb"><tr class="empty-row"><td colspan="13">Loading…</td></tr></tbody>
      </table></div>
    </div>`;

  $("#logoutBtn").onclick = logout;
  $("#refreshBtn").onclick = load;
  $("#csvBtn").onclick = exportCsv;
  $("#copyCsvBtn").onclick = copyCsv;
  $("#zipBtn").onclick = exportCvsZip;
  $("#search").oninput = e => { q = e.target.value; drawRows(); };
  $("#roleFilter").onchange = e => { roleFilter = e.target.value; drawRows(); };
  $("#statusFilter").onchange = e => { statusFilter = e.target.value; drawRows(); };
  $("#dateFrom").onchange = e => { dateFrom = e.target.value; drawRows(); drawStats(); };
  $("#dateTo").onchange = e => { dateTo = e.target.value; drawRows(); drawStats(); };
  $("#clearDates").onclick = () => { dateFrom = ""; dateTo = ""; $("#dateFrom").value = ""; $("#dateTo").value = ""; drawRows(); drawStats(); };

  loadConfig();
  load();
  clearInterval(unsub);
  unsub = setInterval(load, 15000);   // light polling refresh; "Refresh" button also available
}

async function loadConfig(){
  try {
    const { data } = await sb.from("app_config").select("cv_email").eq("id", 1).maybeSingle();
    $("#cfgEmail").value = (data && data.cv_email) || "";
  } catch {}
  $("#cfgSaveBtn").onclick = async () => {
    const v = $("#cfgEmail").value.trim();
    if (v && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { $("#cfgNote").textContent = "Enter a valid email."; return; }
    const { error } = await sb.from("app_config").update({ cv_email: v || null }).eq("id", 1);
    $("#cfgNote").textContent = error ? "Couldn't save." : "Saved.";
    setTimeout(() => { const n = $("#cfgNote"); if (n) n.textContent = ""; }, 2500);
  };
}

async function load(){
  if (syncEl) syncEl.textContent = "Syncing…";
  try {
    const { data, error } = await sb.from("submissions").select("*").order("created_at", { ascending: false }).limit(2000);
    if (error) throw error;
    rows = data || [];
    if (syncEl) syncEl.textContent = "Live · " + rows.length + " total";
    drawStats();
    drawRows();
  } catch (err) {
    if (syncEl) syncEl.textContent = "Couldn't load. Try Refresh.";
    console.warn(err);
  }
}

function inDateRange(r){
  if (!dateFrom && !dateTo) return true;
  const d = new Date(r.created_at);
  if (dateFrom && d < new Date(dateFrom + "T00:00:00")) return false;
  if (dateTo && d > new Date(dateTo + "T23:59:59")) return false;
  return true;
}
function filtered(){
  const query = q.trim().toLowerCase();
  return rows.filter(r =>
    (!roleFilter || r.role === roleFilter) &&
    (!statusFilter || r.status === statusFilter) &&
    inDateRange(r) &&
    (!query || [r.name, r.email, r.phone, r.order_code].some(v => String(v||"").toLowerCase().includes(query)))
  );
}

function drawStats(){
  const inRange = rows.filter(inDateRange);
  const today = new Date().toDateString();
  $("#stats").innerHTML =
    `<div class="stat"><b>${inRange.length}</b><span>Total</span></div>` +
    `<div class="stat"><b>${inRange.filter(r => new Date(r.created_at).toDateString() === today).length}</b><span>Today</span></div>` +
    `<div class="stat"><b>${inRange.filter(r => r.status === "new").length}</b><span>New</span></div>` +
    `<div class="stat"><b>${inRange.filter(r => r.status === "shortlisted").length}</b><span>Shortlisted</span></div>`;
}

function cvCellHtml(r){
  if (r.cv_path) return `<a href="#" class="cvlink" data-path="${esc(r.cv_path)}">Open PDF</a><div class="muted" style="font-size:11.5px">${r.cv_size_bytes ? (r.cv_size_bytes/1024).toFixed(0) + " KB" : ""}</div>`;
  if (r.cv_method === "email") return `<span class="chip">By email</span><div class="muted" style="font-size:11.5px">Subject has ${esc(r.order_code)}</div>`;
  return "—";
}

function drawRows(){
  const tb = $("#tb"); if (!tb) return;
  const list = filtered();
  tb.innerHTML = list.length ? list.map(r => `<tr data-order="${esc(r.order_code)}">
    <td class="num"><b>${esc(r.order_code)}</b>${r.device ? `<div class="muted" style="font-size:11.5px">${esc(r.device)}</div>` : ""}</td>
    <td class="num">${esc(new Date(r.created_at).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}))}</td>
    <td><b>${esc(r.name)}</b><div class="muted">${esc(r.burger||"")}</div></td>
    <td class="num">${esc(r.phone)}<div class="muted">${esc(r.email)}</div></td>
    <td>${esc(L("role",r.role))}</td><td>${esc(L("exp",r.exp))}</td><td>${esc(L("edu",r.edu))}</td>
    <td>${(r.skills||[]).map(k => `<span class="chip">${esc(L("skills",k))}</span>`).join("")}</td>
    <td>${esc(L("style",r.style))}</td><td>${esc(L("avail",r.avail))}</td><td>${esc(L("contract",r.contract))}</td>
    <td>${cvCellHtml(r)}</td>
    <td><select class="status ${esc(r.status)}" data-order="${esc(r.order_code)}">
      <option value="new" ${r.status==="new"?"selected":""}>New</option>
      <option value="reviewed" ${r.status==="reviewed"?"selected":""}>Reviewed</option>
      <option value="shortlisted" ${r.status==="shortlisted"?"selected":""}>Shortlisted</option>
      <option value="rejected" ${r.status==="rejected"?"selected":""}>Rejected</option>
    </select></td>
  </tr>`).join("") : `<tr class="empty-row"><td colspan="13">${rows.length ? "No applicants match this search." : "No submissions yet. They'll appear here the moment a candidate applies."}</td></tr>`;

  tb.querySelectorAll("a.cvlink").forEach(a => a.onclick = async (e) => {
    e.preventDefault();
    const path = a.dataset.path;
    try {
      const { data, error } = await sb.storage.from(CV_BUCKET).createSignedUrl(path, 300);
      if (error) throw error;
      window.open(data.signedUrl, "_blank", "noopener");
    } catch { toast("Couldn't open that PDF."); }
  });
  tb.querySelectorAll("select.status").forEach(sel => sel.onchange = async () => {
    const order = sel.dataset.order, status = sel.value;
    sel.className = "status " + status;
    const { error } = await sb.from("submissions").update({ status }).eq("order_code", order);
    if (error) { toast("Couldn't save status."); return; }
    const row = rows.find(r => r.order_code === order); if (row) row.status = status;
    drawStats();
  });
}

/* =========================================================
   EXPORT: CSV
   ========================================================= */
function csvText(list){
  const head = ["Order","Received","Name","Phone","Email","Role","Experience","Education","Skills","Work style","Start","Contract","Burger","Language","CV method","CV filename","CV size (KB)","Device","Status"];
  const qv = (v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const lines = list.map(r => [
    r.order_code, r.created_at, r.name, r.phone, r.email,
    L("role",r.role), L("exp",r.exp), L("edu",r.edu),
    (r.skills||[]).map(k => L("skills",k)).join("; "),
    L("style",r.style), L("avail",r.avail), L("contract",r.contract),
    r.burger, r.lang,
    r.cv_method === "upload" ? "Uploaded" : r.cv_method === "email" ? "Emailed" : "",
    r.cv_filename || "", r.cv_size_bytes ? (r.cv_size_bytes/1024).toFixed(0) : "",
    r.device || "", r.status
  ].map(qv).join(","));
  return "﻿" + [head.join(","), ...lines].join("\r\n");
}
function downloadText(filename, text, type){
  const blob = new Blob([text], { type: type || "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportCsv(){
  downloadText(`salt-creative-summit-applicants-${new Date().toISOString().slice(0,10)}.csv`, csvText(filtered()));
  toast("CSV downloaded");
}
async function copyCsv(){
  try { await navigator.clipboard.writeText(csvText(filtered())); toast("CSV copied. Paste it into Excel or Sheets."); }
  catch { toast("Copy isn't allowed here. Use Export CSV instead."); }
}

/* =========================================================
   EXPORT: all CVs as a ZIP (store-only zip, no external library needed)
   ========================================================= */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function makeZip(files){ // files: [{name, data: Uint8Array}]
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dt = ((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF, dd = (((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for (const f of files) {
    const nm = enc.encode(f.name), data = f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,dt,true); h.setUint16(12,dd,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true);
    h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
    parts.push(h.buffer, nm, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,dt,true); c.setUint16(14,dd,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true);
    c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    central.push(c.buffer, nm);
    off += 30 + nm.length + data.length;
  }
  const cdSize = central.reduce((s,p) => s + (p.byteLength||p.length), 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...central, e.buffer], { type: "application/zip" });
}
const safeFile = (s) => String(s || "").replace(/[\\/:*?"<>|\u0000-\u001f]+/g, " ").replace(/\s+/g, "_").slice(0, 60) || "candidate";

async function exportCvsZip(){
  const btn = $("#zipBtn"); const old = btn.textContent;
  const list = filtered().filter(r => r.cv_path);
  if (!list.length) { toast("No uploaded CVs to export in the current view."); return; }
  btn.disabled = true;
  try {
    const files = [];
    let done = 0;
    for (const r of list) {
      btn.textContent = `Preparing… (${++done}/${list.length})`;
      try {
        const { data, error } = await sb.storage.from(CV_BUCKET).download(r.cv_path);
        if (error) throw error;
        const bytes = new Uint8Array(await data.arrayBuffer());
        files.push({ name: `${r.order_code}_${safeFile(r.name)}.pdf`, data: bytes });
      } catch (e) { console.warn("skip", r.order_code, e); }
    }
    files.unshift({ name: "applicants.csv", data: new TextEncoder().encode(csvText(list)) });
    const zip = await makeZip(files);
    const url = URL.createObjectURL(zip);
    const a = document.createElement("a"); a.href = url; a.download = `salt-creative-summit-cvs-${new Date().toISOString().slice(0,10)}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(`ZIP ready: ${files.length - 1} CV(s)`);
  } catch (e) {
    toast("Couldn't build the ZIP.");
    console.warn(e);
  }
  btn.disabled = false; btn.textContent = old;
}

/* =========================================================
   BOOT
   ========================================================= */
getSession().then(session => { if (session) renderDashboard(); else renderLogin(); });
})();
